<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>숲속 RPG</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: linear-gradient(#bde8a5, #6da85b);

  color: #18351a;

}

#app {

  max-width: 480px;

  min-height: 100vh;

  margin: auto;

  padding: 18px;

}

.card {

  background: rgba(255,255,255,0.94);

  border-radius: 20px;

  padding: 20px;

  margin-bottom: 15px;

  box-shadow: 0 5px 18px rgba(0,0,0,0.15);

}

h1 {

  text-align: center;

  font-size: 36px;

  margin-bottom: 5px;

}

h2 {

  margin-top: 0;

}

.center {

  text-align: center;

}

button {

  width: 100%;

  padding: 14px;

  margin: 6px 0;

  border: none;

  border-radius: 14px;

  font-size: 16px;

  font-weight: bold;

  background: #e4f3dc;

  color: #18351a;

}

button:active {

  transform: scale(0.98);

}

button:disabled {

  opacity: 0.45;

}

.grid {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 8px;

}

.stats {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 8px;

}

.stat {

  background: #edf7e9;

  border-radius: 12px;

  padding: 10px;

}

.hp-box {

  height: 18px;

  background: #ddd;

  border-radius: 20px;

  overflow: hidden;

}

.hp-bar {

  height: 100%;

  background: #5fbd59;

  transition: 0.3s;

}

.enemy-bar {

  background: #d45d5d;

}

.log {

  height: 150px;

  overflow-y: auto;

  background: #f2f5ef;

  padding: 10px;

  border-radius: 12px;

  margin-top: 10px;

  font-size: 14px;

}

.shop-item {

  border: 1px solid #d4e4ce;

  border-radius: 14px;

  padding: 12px;

  margin: 8px 0;

}

.tag {

  display: inline-block;

  background: #e4f3dc;

  padding: 6px 9px;

  border-radius: 20px;

  margin: 3px;

}

.hidden {

  display: none;

}

.clear {

  text-align: center;

  font-size: 24px;

  font-weight: bold;

}

</style>

</head>

<body>

<div id="app">

<!-- 시작 화면 -->

<section id="home" class="card">

<h1>🌲 숲속 RPG</h1>

<p class="center">

숲속에서 성장하는 작은 모험!

</p>

<button onclick="showScreen('difficulty')">

🎮 모험 시작

</button>

<button onclick="showScreen('character')">

🧑 캐릭터

</button>

</section>

<!-- 난이도 선택 -->

<section id="difficulty" class="card hidden">

<h2>🎮 난이도 선택</h2>

<button onclick="startGame('easy')">

🟢 쉬움

</button>

<button onclick="startGame('normal')">

🔵 보통

</button>

<button onclick="startGame('hard')">

🔴 하드

</button>

<button onclick="showScreen('home')">

⬅️ 돌아가기

</button>

</section>

<!-- 캐릭터 -->

<section id="character" class="card hidden">

<h2>🧑 캐릭터</h2>

<div id="characterInfo"></div>

<button onclick="showScreen('home')">

⬅️ 돌아가기

</button>

</section>

<!-- 마을 -->

<section id="village" class="card hidden">

<h2>🏡 숲속 마을</h2>

<div id="villageInfo"></div>

<button onclick="startBattle()">

⚔️ 다음 전투

</button>

<button onclick="openShop()">

🛒 상점

</button>

<button onclick="updateCharacter(); showScreen('character')">

🧑 캐릭터 보기

</button>

</section>

<!-- 상점 -->

<section id="shop" class="card hidden">

<h2>🛒 숲속 상점</h2>

<p id="shopGold"></p>

<div class="shop-item">

🧪 <b>회복약</b>

<br>

15G

<br>

<small>

HP를 15 회복합니다.

</small>

<button onclick="buyItem('potion')">

구매

</button>

</div>

<div class="shop-item">

⚔️ <b>숲의 검</b>

<br>

50G

<br>

<small>

공격력 +3

</small>

<button onclick="buyItem('attack')">

구매

</button>

</div>

<div class="shop-item">

🛡️ <b>수호의 갑옷</b>

<br>

60G

<br>

<small>

방어력 +3

</small>

<button onclick="buyItem('defense')">

구매

</button>

</div>

<div class="shop-item">

🍃 <b>생명의 잎</b>

<br>

40G

<br>

<small>

최대 HP +8

</small>

<button onclick="buyItem('maxhp')">

구매

</button>

</div>

<button onclick="showScreen('village')">

⬅️ 마을로

</button>

</section>

<!-- 직업 선택 -->

<section id="job" class="card hidden">

<h2>🧑 직업 선택</h2>

<p>

레벨 2가 되었습니다!

<br>

원하는 직업을 선택하세요.

</p>

<button onclick="chooseJob('전사')">

⚔️ 전사

<br>

높은 공격력과 방어력

<br>

💥 강타

</button>

<button onclick="chooseJob('궁수')">

🏹 궁수

<br>

치명타 확률

<br>

🏹 연사

</button>

<button onclick="chooseJob('마법사')">

🔮 마법사

<br>

높은 공격력

<br>

🔥 파이어볼

</button>

</section>

<!-- 전투 -->

<section id="battle" class="card hidden">

<h2 id="battleTitle">

⚔️ 전투

</h2>

<div id="battleInfo"></div>

<h3>🧑 플레이어</h3>

<div class="hp-box">

<div id="playerBar" class="hp-bar"></div>

</div>

<p id="playerHP"></p>

<h3 id="enemyName">

👹 적

</h3>

<div class="hp-box">

<div id="enemyBar" class="hp-bar enemy-bar"></div>

</div>

<p id="enemyHP"></p>

<div class="grid">

<button onclick="attack()">

⚔️ 공격

</button>

<button id="skillButton" onclick="useSkill()">

✨ 스킬

</button>

</div>

<button onclick="heal()">

💚 회복

</button>

<div id="battleLog" class="log"></div>

</section>

<!-- 게임 클리어 -->

<section id="clear" class="card">

<div class="clear">

🏆 게임 클리어! 🏆

</div>

<p id="clearText" class="center"></p>

<button onclick="showScreen('difficulty')">

🔄 다시 시작

</button>

</section>

</div>

<script>

// ==========================

// 게임 데이터

// ==========================

let player = {

  level: 1,

  gold: 20,

  maxHP: 50,

  hp: 50,

  attack: 8,

  defense: 3,

  job: null,

  skillCooldown: 0

};

let difficulty = "normal";

let round = 0;

let enemy = null;

let gameOver = false;

// 난이도

const difficultyData = {

  easy: {

    name: "쉬움",

    hp: 0.75,

    attack: 0.8,

    reward: 0.8

  },

  normal: {

    name: "보통",

    hp: 1,

    attack: 1,

    reward: 1

  },

  hard: {

    name: "하드",

    hp: 1.5,

    attack: 1.25,

    reward: 1.5

  }

};

// 클리어 보상

const clearReward = {

  easy: "🌿 숲의 부적",

  normal: "⚔️ 용사의 검",

  hard: "👑 고대 숲의 왕관"

};

// ==========================

// 화면 변경

// ==========================

function showScreen(id) {

  document

    .querySelectorAll("#app > section")

    .forEach(section => {

      section.classList.add("hidden");

    });

  document

    .getElementById(id)

    .classList.remove("hidden");

}

// ==========================

// 게임 시작

// ==========================

function startGame(selectedDifficulty) {

  difficulty = selectedDifficulty;

  player = {

    level: 1,

    gold: 20,

    maxHP: 50,

    hp: 50,

    attack: 8,

    defense: 3,

    job: null,

    skillCooldown: 0

  };

  round = 0;

  gameOver = false;

  updateVillage();

  showScreen("village");

  addLog(

    "🌲 모험을 시작했습니다!"

  );

}

// ==========================

// 캐릭터 정보

// ==========================

function updateCharacter() {

  document.getElementById(

    "characterInfo"

  ).innerHTML = `

  <div class="stats">

    <div class="stat">

      ⭐ 레벨<br>

      <b>${player.level}</b>

    </div>

    <div class="stat">

      💰 골드<br>

      <b>${player.gold}G</b>

    </div>

    <div class="stat">

      ❤️ HP<br>

      <b>${player.hp}/${player.maxHP}</b>

    </div>

    <div class="stat">

      ⚔️ 공격력<br>

      <b>${player.attack}</b>

    </div>

    <div class="stat">

      🛡️ 방어력<br>

      <b>${player.defense}</b>

    </div>

    <div class="stat">

      🧑 직업<br>

      <b>${player.job || "초보 모험가"}</b>

    </div>

  </div>

  `;

}

// ==========================

// 마을 정보

// ==========================

function updateVillage() {

  document.getElementById(

    "villageInfo"

  ).innerHTML = `

  <span class="tag">

  🎮 ${difficultyData[difficulty].name}

  </span>

  <span class="tag">

  ⭐ Lv.${player.level}

  </span>

  <span class="tag">

  💰 ${player.gold}G

  </span>

  <span class="tag">

  🏁 ${round}라운드

  </span>

  `;

}

// ==========================

// 상점

// ==========================

function openShop() {

  showScreen("shop");

  document.getElementById(

    "shopGold"

  ).innerHTML =

  `💰 현재 골드: <b>${player.gold}G</b>`;

}

function buyItem(item) {

  let price = {

    potion: 15,

    attack: 50,

    defense: 60,

    maxhp: 40

  }[item];

  if (player.gold < price) {

    alert("💰 골드가 부족합니다!");

    return;

  }

  player.gold -= price;

  if (item === "potion") {

    player.hp =

      Math.min(

        player.maxHP,

        player.hp + 15

      );

    addLog("🧪 회복약을 사용했습니다!");

  }

  if (item === "attack") {

    player.attack += 3;

    addLog("⚔️ 공격력이 3 증가했습니다!");

  }

  if (item === "defense") {

    player.defense += 3;

    addLog("🛡️ 방어력이 3 증가했습니다!");

  }

  if (item === "maxhp") {

    player.maxHP += 8;

    player.hp += 8;

    addLog("❤️ 최대 HP가 8 증가했습니다!");

  }

  openShop();

}

// ==========================

// 직업 선택

// ==========================

function chooseJob(job) {

  player.job = job;

  if (job === "전사") {

    player.attack += 3;

    player.defense += 2;

  }

  if (job === "궁수") {

    player.attack += 2;

  }

  if (job === "마법사") {

    player.attack += 5;

  }

  updateVillage();

  showScreen("village");

  addLog(

    "🎉 " + job + "가 되었습니다!"

  );

}

// ==========================

// 전투 시작

// ==========================

function startBattle() {

  round++;

  gameOver = false;

  let isBoss =

    round % 20 === 0;

  let isFinalBoss =

    round === 40;

  let monsterName;

  if (player.level < 3) {

    monsterName = "🐗 숲멧돼지";

  } else if (player.level < 5) {

    monsterName = "👹 동굴 오크";

  } else if (player.level < 8) {

    monsterName = "🤖 강철 골렘";

  } else {

    monsterName = "🐲 고대 드래곤";

  }

  let baseHP =

    12 + (player.level - 1) * 8;

  let multiplier =

    difficultyData[difficulty].hp;

  if (isBoss) {

    multiplier *= 3;

  }

  if (isFinalBoss) {

    multiplier *= 5;

  }

  let enemyName;

  if (isFinalBoss) {

    enemyName =

      "👑 최종 보스 — 고대 숲의 왕";

  } else if (isBoss) {

    enemyName =

      "👹 보스 — 숲의 지배자";

  } else {

    enemyName =

      monsterName;

  }

  enemy = {

    name: enemyName,

    maxHP:

      Math.max(

        10,

        Math.round(

          baseHP * multiplier

        )

      ),

    hp: 0,

    attack:

      Math.round(

        (4 + player.level * 2)

        * difficultyData[difficulty].attack

        * (isBoss ? 1.5 : 1)

        * (isFinalBoss ? 1.7 : 1)

      ),

    boss: isBoss,

    finalBoss: isFinalBoss

  };

  enemy.hp = enemy.maxHP;

  showScreen("battle");

  renderBattle();

  if (isFinalBoss) {

    addLog(

      "👑 최종 보스가 나타났습니다!"

    );

  } else if (isBoss) {

    addLog(

      "⚠️ 강력한 보스가 나타났습니다!"

    );

  } else {

    addLog(

      "🌲 " + enemy.name +

      "와 전투가 시작되었습니다!"

    );

  }

}

// ==========================

// 전투 화면

// ==========================

function renderBattle() {

  document.getElementById(

    "battleTitle"

  ).textContent =

    enemy.finalBoss

      ? "👑 최종 결전"

      : enemy.boss

      ? "👹 보스 전투"

      : "⚔️ 전투";

  document.getElementById(

    "battleInfo"

  ).innerHTML = `

  난이도:

  ${difficultyData[difficulty].name}

 　|　

  라운드:

  ${round}

 　|　

  Lv.${player.level}

  `;

  document.getElementById(

    "playerHP"

  ).textContent =

    `${player.hp} / ${player.maxHP}`;

  document.getElementById(

    "enemyName"

  ).textContent =

    enemy.name;

  document.getElementById(

    "enemyHP"

  ).textContent =

    `${enemy.hp} / ${enemy.maxHP}`;

  document.getElementById(

    "playerBar"

  ).style.width =

    (player.hp / player.maxHP * 100)

    + "%";

  document.getElementById(

    "enemyBar"

  ).style.width =

    (enemy.hp / enemy.maxHP * 100)

    + "%";

  let skillName = "✨ 스킬";

  if (player.job === "전사")

    skillName = "💥 강타";

  if (player.job === "궁수")

    skillName = "🏹 연사";

  if (player.job === "마법사")

    skillName = "🔥 파이어볼";

  if (player.skillCooldown > 0) {

    skillName +=

      " (" +

      player.skillCooldown +

      ")";

  }

  document.getElementById(

    "skillButton"

  ).textContent =

    skillName;

  document.getElementById(

    "skillButton"

  ).disabled =

    !player.job ||

    player.skillCooldown > 0 ||

    gameOver;

}

// ==========================

// 로그

// ==========================

function addLog(message) {

  let log =

    document.getElementById(

      "battleLog"

    );

  if (!log) return;

  log.innerHTML +=

    `<div>${message}</div>`;

  log.scrollTop =

    log.scrollHeight;

}

// ==========================

// 일반 공격

// ==========================

function attack() {

  if (gameOver) return;

  let damage =

    player.attack +

    Math.floor(

      Math.random() * 5

    );

  // 궁수 치명타

  if (

    player.job === "궁수" &&

    Math.random() < 0.25

  ) {

    damage *= 2;

    addLog(

      "🏹 치명타!"

    );

  }

  // 마법사 추가 효과

  if (

    player.job === "마법사" &&

    Math.random() < 0.2

  ) {

    damage += 10;

    addLog(

      "🔮 마법 효과 발동!"

    );

  }

  dealDamage(damage);

}

// ==========================

// 스킬

// ==========================

function useSkill() {

  if (

    gameOver ||

    !player.job ||

    player.skillCooldown > 0

  ) return;

  let damage = 0;

  if (player.job === "전사") {

    damage =

      player.attack * 2 +

      player.level +

      Math.floor(

        Math.random() * 6

      );

    player.skillCooldown = 3;

    addLog(

      "💥 강타!"

    );

  }

  if (player.job === "궁수") {

    damage =

      player.attack +

      Math.floor(Math.random() * 5);

    damage +=

      player.attack +

      Math.floor(Math.random() * 5);

    player.skillCooldown = 3;

    addLog(

      "🏹 연사!"

    );

  }

  if (player.job === "마법사") {

    damage =

      player.attack * 2 +

      10 +

      player.level * 2;

    player.skillCooldown = 4;

    addLog(

      "🔥 파이어볼!"

    );

  }

  dealDamage(damage);

}

// ==========================

// 피해

// ==========================

function dealDamage(damage) {

  enemy.hp =

    Math.max(

      0,

      enemy.hp - damage

    );

  addLog(

    `⚔️ ${damage}의 피해를 주었습니다!`

  );

  if (enemy.hp <= 0) {

    victory();

    return;

  }

  enemyAttack();

  renderBattle();

}

// ==========================

// 적 공격

// ==========================

function enemyAttack() {

  if (enemy.hp <= 0)

    return;

  let chance =

    Math.min(

      0.6,

      0.18 +

      player.level * 0.045

    );

  if (Math.random() < chance) {

    let damage =

      Math.max(

        1,

        enemy.attack -

        player.defense +

        Math.floor(

          Math.random() * 3

        )

      );

    player.hp =

      Math.max(

        0,

        player.hp - damage

      );

    addLog(

      `👹 적의 공격! ${damage} 피해를 받았습니다.`

    );

  } else {

    addLog(

      "✨ 적의 공격을 피했습니다!"

    );

  }

  if (player.hp <= 0) {

    gameOver = true;

    addLog(

      "💫 쓰러졌습니다..."

    );

    alert(

      "게임 오버!\n다시 시작해보세요."

    );

  }

  if (player.skillCooldown > 0) {

    player.skillCooldown--;

  }

}

// ==========================

// 회복

// ==========================

function heal() {

  if (gameOver)

    return;

  let oldHP =

    player.hp;

  player.hp =

    Math.min(

      player.maxHP,

      player.hp + 10 + player.level

    );

  addLog(

    `💚 ${player.hp - oldHP} HP를 회복했습니다!`

  );

  enemyAttack();

  renderBattle();

}

// ==========================

// 승리

// ==========================

function victory() {

  let reward =

    8 +

    player.level * 4;

  reward *=

    difficultyData[difficulty].reward;

  if (enemy.boss)

    reward *= 3;

  if (enemy.finalBoss)

    reward *= 5;

  reward =

    Math.round(reward);

  player.gold += reward;

  player.level++;

  player.hp =

    Math.min(

      player.maxHP,

      player.hp + 10

    );

  addLog(

    `🏆 승리! ${reward}G를 획득했습니다!`

  );

  // 최종 보스

  if (enemy.finalBoss) {

    gameClear();

    return;

  }

  // 레벨 2 직업 선택

  if (

    player.level === 2 &&

    player.job === null

  ) {

    showScreen("job");

    return;

  }

  updateVillage();

  showScreen("village");

}

// ==========================

// 게임 클리어

// ==========================

function gameClear() {

  showScreen("clear");

  document.getElementById(

    "clearText"

  ).innerHTML = `

  🎉 축하합니다!<br><br>

  최종 보스를 물리쳤습니다!<br><br>

  🎮 난이도:

  <b>

  ${difficultyData[difficulty].name}

  </b>

  <br><br>

  🎁 클리어 보상:<br>

  <b>

  ${clearReward[difficulty]}

  </b>

  <br><br>

  💰 최종 골드:

  <b>

  ${player.gold}G

  </b>

  `;

}

// 시작 시 캐릭터 정보

updateCharacter();

</script>

</body>

</html>
